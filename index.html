<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Council President Dashboard</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #f4f6fb;
    color: #222;
}

header {
    background: #182848;
    color: white;
    padding: 20px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h1 {
    font-size: 24px;
}

.container {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

.card h2 {
    font-size: 16px;
    color: #666;
}

.number {
    font-size: 32px;
    font-weight: bold;
    margin-top: 8px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

section {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    margin-bottom: 25px;
}

section h2 {
    margin-bottom: 18px;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    margin: 7px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
}

textarea {
    min-height: 120px;
    resize: vertical;
}

button {
    border: none;
    padding: 11px 16px;
    border-radius: 8px;
    cursor: pointer;
    background: #182848;
    color: white;
    margin-top: 8px;
}

button:hover {
    opacity: .85;
}

.event {
    border-left: 5px solid #182848;
    padding: 12px;
    margin-bottom: 12px;
    background: #f7f8fc;
    border-radius: 8px;
}

.event strong {
    display: block;
    font-size: 17px;
}

.event small {
    color: #666;
}

.delete {
    background: #d9534f;
    margin-left: 5px;
}

.priority-high {
    border-left-color: #d9534f;
}

.priority-medium {
    border-left-color: #f0ad4e;
}

.priority-low {
    border-left-color: #5cb85c;
}

.todo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-bottom: 1px solid #eee;
}

.todo input {
    width: auto;
}

.completed {
    text-decoration: line-through;
    color: #999;
}

@media(max-width: 750px) {
    .dashboard,
    .grid {
        grid-template-columns: 1fr;
    }

    header {
        flex-direction: column;
        gap: 10px;
        text-align: center;
    }
}
</style>
</head>

<body>

<header>
    <h1>🎓 Student Council President</h1>
    <div id="date"></div>
</header>

<div class="container">

    <div class="dashboard">

        <div class="card">
            <h2>Upcoming Events</h2>
            <div class="number" id="eventCount">0</div>
        </div>

        <div class="card">
            <h2>Tasks</h2>
            <div class="number" id="taskCount">0</div>
        </div>

        <div class="card">
            <h2>High Priority</h2>
            <div class="number" id="priorityCount">0</div>
        </div>

    </div>

    <div class="grid">

        <section>
            <h2>📅 Add Schedule Event</h2>

            <input id="eventName" placeholder="Event name">

            <input id="eventDate" type="date">

            <input id="eventTime" type="time">

            <input id="eventLocation" placeholder="Location">

            <select id="priority">
                <option value="low">Low Priority</option>
                <option value="medium">Medium Priority</option>
                <option value="high">High Priority</option>
            </select>

            <button onclick="addEvent()">Add Event</button>
        </section>

        <section>
            <h2>✅ Add To-Do</h2>

            <input id="taskInput" placeholder="Example: Plan spirit week">

            <button onclick="addTask()">Add Task</button>

            <div id="tasks"></div>
        </section>

    </div>

    <section>
        <h2>📆 Upcoming Schedule</h2>
        <div id="events"></div>
    </section>

    <section>
        <h2>📝 President's Meeting Notes</h2>

        <textarea id="notes"
        placeholder="Write meeting notes, ideas, announcements, reminders, etc..."></textarea>

        <button onclick="saveNotes()">Save Notes</button>
    </section>

</div>

<script>

let events = JSON.parse(localStorage.getItem("events")) || [];
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

document.getElementById("date").innerText =
    new Date().toLocaleDateString(undefined, {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    });

document.getElementById("notes").value =
    localStorage.getItem("notes") || "";

function saveData() {
    localStorage.setItem("events", JSON.stringify(events));
    localStorage.setItem("tasks", JSON.stringify(tasks));
}

function addEvent() {

    const name = document.getElementById("eventName").value;
    const date = document.getElementById("eventDate").value;
    const time = document.getElementById("eventTime").value;
    const location = document.getElementById("eventLocation").value;
    const priority = document.getElementById("priority").value;

    if (!name || !date) {
        alert("Please enter an event name and date.");
        return;
    }

    events.push({
        id: Date.now(),
        name,
        date,
        time,
        location,
        priority
    });

    saveData();
    displayEvents();

    document.getElementById("eventName").value = "";
    document.getElementById("eventDate").value = "";
    document.getElementById("eventTime").value = "";
    document.getElementById("eventLocation").value = "";
}

function deleteEvent(id) {

    events = events.filter(event => event.id !== id);

    saveData();
    displayEvents();
}

function displayEvents() {

    const container = document.getElementById("events");

    container.innerHTML = "";

    events.sort((a,b) =>
        new Date(a.date + " " + a.time) -
        new Date(b.date + " " + b.time)
    );

    events.forEach(event => {

        const div = document.createElement("div");

        div.className = `event priority-${event.priority}`;

        div.innerHTML = `
            <strong>${event.name}</strong>
            <small>
                📅 ${event.date}
                ${event.time ? " • ⏰ " + event.time : ""}
                ${event.location ? " • 📍 " + event.location : ""}
                • ${event.priority.toUpperCase()} PRIORITY
            </small>
            <br>
            <button class="delete"
                onclick="deleteEvent(${event.id})">
                Delete
            </button>
        `;

        container.appendChild(div);
    });

    updateDashboard();
}

function addTask() {

    const input = document.getElementById("taskInput");

    if (!input.value.trim()) return;

    tasks.push({
        id: Date.now(),
        text: input.value,
        completed: false
    });

    input.value = "";

    saveData();
    displayTasks();
}

function toggleTask(id) {

    const task = tasks.find(t => t.id === id);

    task.completed = !task.completed;

    saveData();
    displayTasks();
}

function deleteTask(id) {

    tasks = tasks.filter(task => task.id !== id);

    saveData();
    displayTasks();
}

function displayTasks() {

    const container = document.getElementById("tasks");

    container.innerHTML = "";

    tasks.forEach(task => {

        const div = document.createElement("div");

        div.className = "todo";

        div.innerHTML = `
            <input type="checkbox"
                ${task.completed ? "checked" : ""}
                onchange="toggleTask(${task.id})">

            <span class="${task.completed ? "completed" : ""}">
                ${task.text}
            </span>

            <button class="delete"
                onclick="deleteTask(${task.id})">
                ×
            </button>
        `;

        container.appendChild(div);
    });

    updateDashboard();
}

function updateDashboard() {

    document.getElementById("eventCount").innerText =
        events.length;

    document.getElementById("taskCount").innerText =
        tasks.filter(t => !t.completed).length;

    document.getElementById("priorityCount").innerText =
        events.filter(e => e.priority === "high").length;
}

function saveNotes() {

    localStorage.setItem(
        "notes",
        document.getElementById("notes").value
    );

    alert("Notes saved!");
}

displayEvents();
displayTasks();

</script>

</body>
</html>
